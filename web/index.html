<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Binance 24H Top Gainers Tracker with Realtime Candlestick Chart & Imbalance Detector">
  <meta name="theme-color" content="#121418">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons for Standalone Web App -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CoinPulse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CoinPulse ⚡ Binance Top Gainers</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      background-color: #121418;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <!-- Aggressively clear old cache and service workers on iPhone / Safari -->
  <script>
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // Auto-update check for iOS Standalone PWA mode
    if (window.navigator.standalone) {
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          fetch('index.html?t=' + Date.now(), { cache: 'no-store' })
            .then(function(res) { return res.text(); })
            .then(function(html) {
              var currentScript = document.querySelector('script[src*="flutter_bootstrap.js"]');
              if (currentScript && html.includes('flutter_bootstrap.js') && !html.includes(currentScript.getAttribute('src'))) {
                window.location.reload();
              }
            }).catch(function() {});
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=20261006_V6_FIX_OFFSET" async></script>
</body>
</html>
